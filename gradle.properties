# JVM 参数：gradle 守护进程内存
# 注意：本机 jadx 反编译任务常驻占用 ~15G 内存，系统空闲内存少；
# 因此刻意调低 daemon 堆并限制 worker 数，防止 D8 dexing 阶段 JVM native OOM。
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
# 单模块工程，无需并行；限制 worker 降低内存峰值
org.gradle.workers.max=2
# Kotlin 编译守护进程单独限内存
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.caching=true

# AndroidX 支持
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 代码风格（官方默认，保留）
kotlin.code.style=official
